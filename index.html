<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红金飞剑 · 手势剑阵</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #video {
	    position: fixed; bottom: 12px; right: 12px; z-index: 100;
	    width: 160px; border: 2px solid rgba(255,150,50,0.6);
	    border-radius: 10px; transform: scaleX(-1);
	    box-shadow: 0 0 12px rgba(255,100,0,0.35);
	  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,200,100,0.7); font-family: 'Segoe UI', sans-serif;
    font-size: 13px; pointer-events: none; z-index: 10;
    text-align: center; transition: opacity 0.5s;
  }
  #status {
    position: fixed; top: 16px; right: 20px;
    color: rgba(255,180,80,0.8); font-family: monospace;
    font-size: 11px; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<div id="hint">等待摄像头…<br>手势：五指张开→炸开 | 握拳→收拢 | 食指→横铺 | 三指→落剑 | 剑指→游龙</div>
<div id="status"></div>

<!-- Three.js UMD -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>

<script>
// ========== 常量 & 配置 ==========
const SWORD_COUNT = 200;
const LERP_SPEED = 2.2;          // 位置插值速度
const SMOOTH_ALPHA = 0.65;       // 手势平滑系数（越大越平滑）
const GESTURE_FRAMES = 4;        // 手势确认帧数

// ========== DOM ==========
const video = document.getElementById('video');
const hintEl = document.getElementById('hint');
const statusEl = document.getElementById('status');

// ========== Three.js 初始化 ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030311);
scene.fog = new THREE.FogExp2(0x030311, 0.00015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 80);
camera.position.set(0, 1.5, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ========== 灯光 ==========
scene.add(new THREE.AmbientLight(0x110022, 0.6));
const pointLight = new THREE.PointLight(0xff4400, 30, 15, 1.5);
pointLight.position.set(0, 0, 0);
scene.add(pointLight);
const pointLight2 = new THREE.PointLight(0xff8800, 15, 10, 2);
pointLight2.position.set(3, 2, 3);
scene.add(pointLight2);

// ========== 星空背景 ==========
function createStarfield() {
  const count = 1200;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 18 + Math.random() * 25;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = Math.sin(phi) * Math.cos(theta) * r;
    positions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
    positions[i * 3 + 2] = Math.cos(phi) * r;
    const brightness = 0.4 + Math.random() * 0.6;
    colors[i * 3]     = brightness;
    colors[i * 3 + 1] = brightness * (0.7 + Math.random() * 0.3);
    colors[i * 3 + 2] = brightness * (0.5 + Math.random() * 0.5);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({ size: 0.06, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false });
  scene.add(new THREE.Points(geo, mat));
}
createStarfield();

// ========== 飞剑几何体 ==========
function createSwordGeometry() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.55);        // 剑尖
  shape.lineTo(0.035, 0.06);    // 右上刃
  shape.lineTo(0.018, -0.55);   // 右剑柄座
  shape.lineTo(-0.018, -0.55);  // 左剑柄座
  shape.lineTo(-0.035, 0.06);   // 左上刃
  shape.closePath();
  return new THREE.ShapeGeometry(shape);
}

const swordGeo = createSwordGeometry();
swordGeo.computeVertexNormals();

// 辉光几何体（比剑稍大）
const glowGeo = createSwordGeometry();
glowGeo.computeVertexNormals();

// ========== 材质 ==========
const swordMaterial = new THREE.MeshStandardMaterial({
  color: 0xdd2200,
  roughness: 0.2,
  metalness: 0.5,
  emissive: 0x881100,
  emissiveIntensity: 1.5,
  side: THREE.DoubleSide,
});

const glowMaterial = new THREE.MeshBasicMaterial({
  color: 0xff8800,
  transparent: true,
  opacity: 0.45,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide,
});

// ========== InstancedMesh ==========
const swordMesh = new THREE.InstancedMesh(swordGeo, swordMaterial, SWORD_COUNT);
swordMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
swordMesh.castShadow = true;
scene.add(swordMesh);

const glowMesh = new THREE.InstancedMesh(glowGeo, glowMaterial, SWORD_COUNT);
glowMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(glowMesh);

// ========== 粒子拖尾（剑光尾迹） ==========
const trailCount = SWORD_COUNT * 3;
const trailGeo = new THREE.BufferGeometry();
const trailPositionsArr = new Float32Array(trailCount * 3);
const trailSizesArr = new Float32Array(trailCount);
for (let i = 0; i < trailCount; i++) {
  trailPositionsArr[i * 3] = (Math.random() - 0.5) * 10;
  trailPositionsArr[i * 3 + 1] = (Math.random() - 0.5) * 10;
  trailPositionsArr[i * 3 + 2] = (Math.random() - 0.5) * 10;
  trailSizesArr[i] = Math.random() * 0.08 + 0.02;
}
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositionsArr, 3));
trailGeo.setAttribute('size', new THREE.BufferAttribute(trailSizesArr, 1));
const trailMat = new THREE.PointsMaterial({
  color: 0xff4400,
  size: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.5,
});
const trailPoints = new THREE.Points(trailGeo, trailMat);
scene.add(trailPoints);

// ========== 状态变量 ==========
const matrix4 = new THREE.Matrix4();
const quat = new THREE.Quaternion();
const scl = new THREE.Vector3();
const upVec = new THREE.Vector3(0, 1, 0);

// 每个飞剑的当前位置
const currentPositions = [];
const targetPositions = [];
const swordDirections = []; // 每个剑的朝向
for (let i = 0; i < SWORD_COUNT; i++) {
  currentPositions.push(new THREE.Vector3((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4));
  targetPositions.push(new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2));
  swordDirections.push(new THREE.Vector3(0, 1, 0));
}

let clusterBase = new THREE.Vector3(0, 0, 0);
let clusterTargetBase = new THREE.Vector3(0, 0, 0);

// 手势状态
let currentGesture = 'idle';
let gestureBuffer = [];
let lastHandData = null;

// 落剑专用：每把剑独立的速度/相位/摆幅
const rainSpeeds = new Float32Array(SWORD_COUNT);
const rainPhases = new Float32Array(SWORD_COUNT);
const rainWobbleAmp = new Float32Array(SWORD_COUNT);
for (let i = 0; i < SWORD_COUNT; i++) {
  rainSpeeds[i] = 3 + Math.random() * 6;       // 下落速度 3~9
  rainPhases[i] = Math.random() * Math.PI * 2;   // 摆动相位
  rainWobbleAmp[i] = 0.3 + Math.random() * 1.2;  // 摆幅
}

// 跟随模式：手指指向的世界坐标目标
let followAccum = new THREE.Vector3(0, 0, 0);
let followTarget = new THREE.Vector3(0, 0, 0);
let followPointDir = new THREE.Vector3(0, 0, 0); // 手指指向方向（世界坐标）

// ========== 分段飘带跟随系统 ==========
const PATH_HISTORY_LENGTH = 300;
const pathHistory = [];
for (let i = 0; i < PATH_HISTORY_LENGTH; i++) {
  pathHistory.push(new THREE.Vector3(0, 0, 0));
}
let pathWriteHead = 0;

const SEGMENT_COUNT = 20;
const SWORDS_PER_SEGMENT = Math.floor(SWORD_COUNT / SEGMENT_COUNT);
const SEGMENT_FRAME_SPACING = 4; // 每段间隔帧数，值越大拖尾越长

// 平滑后的手部关键点
let smoothedLandmarks = null;

// ========== 工具函数 ==========
function dist3D(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2);
}

function dist2D(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

// 判断手指是否伸直（MCP→PIP 与 PIP→TIP 两段向量夹角，共线≈伸直，弯折≈卷曲）
function isFingerStraight(lm, mcpIdx, pipIdx, tipIdx) {
  const mcp = lm[mcpIdx], pip = lm[pipIdx], tip = lm[tipIdx];
  const v1x = pip.x - mcp.x, v1y = pip.y - mcp.y, v1z = (pip.z || 0) - (mcp.z || 0);
  const v2x = tip.x - pip.x, v2y = tip.y - pip.y, v2z = (tip.z || 0) - (pip.z || 0);
  const dot = v1x * v2x + v1y * v2y + v1z * v2z;
  const m1 = Math.sqrt(v1x * v1x + v1y * v1y + v1z * v1z);
  const m2 = Math.sqrt(v2x * v2x + v2y * v2y + v2z * v2z);
  if (m1 < 0.003 || m2 < 0.003) return false;
  return dot / (m1 * m2) > 0.85; // cos⁻¹(0.85)≈32°，严格要求伸直
}

// 拇指专用：拇指侧向伸展，使用距离法更可靠
function isThumbStraight(lm) {
  const tip = lm[4], ip = lm[3], mcp = lm[2], wrist = lm[0];
  const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
  const ipDist = Math.hypot(ip.x - wrist.x, ip.y - wrist.y);
  return tipDist > ipDist * 1.06;
}

// ========== 手势识别 ==========
function recognizeGesture(lm) {
  const thumbUp = isThumbStraight(lm);
  const indexUp = isFingerStraight(lm, 5, 6, 8);    // MCP→PIP→TIP
  const middleUp = isFingerStraight(lm, 9, 10, 12);
  const ringUp = isFingerStraight(lm, 13, 14, 16);
  const pinkyUp = isFingerStraight(lm, 17, 18, 20);

  const upCount = [thumbUp, indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;

  // 5. 枪形（拇指+食指）或剑指（食指+中指，无名指小指必须弯曲）→ 跟随指向
  //    优先判定，避免被烟花/光球误吞
  if ((thumbUp && indexUp && !middleUp && !ringUp && !pinkyUp) ||
      (indexUp && middleUp && !ringUp && !pinkyUp)) return 'follow';

  // 3. 仅食指伸直 → 横铺剑幕
  if (indexUp && !middleUp && !ringUp && !pinkyUp) return 'spread';

  // 4. 拇指+食指+小指（三指竖起，中指无名指弯曲）→ 落剑
  if (thumbUp && indexUp && pinkyUp && !middleUp && !ringUp) return 'rain';

  // 1. 五指全张 → 炸开（额外确认指尖张开间距）
  //    注意：此时已排除 follow/spread/rain，所以五指张开必为 explode
  if (upCount >= 4) {
    const spread = dist2D(lm[8], lm[20]); // 食指尖到小指尖距离
    if (spread > 0.15) return 'explode';
    if (upCount === 5) return 'converge';
  }

  // 2. 全收 → 握拳收拢
  if (upCount <= 1) return 'converge';

  return currentGesture;
}

// 手势缓冲去抖
function stabilizeGesture(raw) {
  gestureBuffer.push(raw);
  if (gestureBuffer.length > GESTURE_FRAMES) gestureBuffer.shift();
  const tally = {};
  for (const g of gestureBuffer) tally[g] = (tally[g] || 0) + 1;
  let best = raw, bestCount = 0;
  for (const [g, c] of Object.entries(tally)) {
    if (c > bestCount) { best = g; bestCount = c; }
  }
  // 需要至少一半帧一致才切换
  if (bestCount >= Math.ceil(GESTURE_FRAMES * 0.6)) return best;
  return currentGesture;
}

// 平滑手部关键点
function smoothLandmarks(newLM) {
  if (!smoothedLandmarks) {
    smoothedLandmarks = newLM.map(l => ({ ...l }));
    return smoothedLandmarks;
  }
  for (let i = 0; i < newLM.length; i++) {
    smoothedLandmarks[i].x += (newLM[i].x - smoothedLandmarks[i].x) * (1 - SMOOTH_ALPHA);
    smoothedLandmarks[i].y += (newLM[i].y - smoothedLandmarks[i].y) * (1 - SMOOTH_ALPHA);
    smoothedLandmarks[i].z += (newLM[i].z - smoothedLandmarks[i].z) * (1 - SMOOTH_ALPHA);
  }
  return smoothedLandmarks;
}

// ========== 计算目标位置 ==========
function computeExplodeTargets() {
  const radius = 4.5;
  const rings = 3;
  let idx = 0;
  for (let r = 0; r < rings; r++) {
    const ringRadius = radius * (0.55 + r * 0.25);
    const ringCount = Math.floor(SWORD_COUNT / rings);
    for (let i = 0; i < ringCount && idx < SWORD_COUNT; i++) {
      const angle = (i / ringCount) * Math.PI * 2 + r * 0.8;
      const x = Math.cos(angle) * ringRadius;
      const z = Math.sin(angle) * ringRadius;
      const y = (Math.random() - 0.5) * 1.2 + r * 0.4 - 0.6;
      targetPositions[idx].set(x, y, z);
      swordDirections[idx].set(Math.cos(angle), 0, Math.sin(angle)).normalize();
      idx++;
    }
  }
  for (; idx < SWORD_COUNT; idx++) {
    const angle = Math.random() * Math.PI * 2;
    const r2 = radius * (0.5 + Math.random() * 0.5);
    targetPositions[idx].set(Math.cos(angle) * r2, (Math.random() - 0.5) * 2, Math.sin(angle) * r2);
    swordDirections[idx].set(Math.cos(angle), 0, Math.sin(angle)).normalize();
  }
}

function computeConvergeTargets() {
  const radius = 1.8;
  for (let i = 0; i < SWORD_COUNT; i++) {
    // 斐波那契球分布
    const phi = Math.acos(1 - 2 * (i + 0.5) / SWORD_COUNT);
    const theta = Math.PI * (1 + Math.sqrt(5)) * i;
    const x = Math.cos(theta) * Math.sin(phi) * radius;
    const y = Math.cos(phi) * radius;
    const z = Math.sin(theta) * Math.sin(phi) * radius;
    targetPositions[i].set(x, y, z);
    // 剑尖朝外
    swordDirections[i].set(x, y, z).normalize();
  }
}

function computeSpreadTargets() {
  const width = 7;
  const height = 4.5;
  const cols = Math.ceil(Math.sqrt(SWORD_COUNT * 2));
  const rows = Math.ceil(SWORD_COUNT / cols);
  for (let i = 0; i < SWORD_COUNT; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = (col / (cols - 1 || 1) - 0.5) * width;
    const y = (row / (rows - 1 || 1) - 0.5) * height + 1.5;
    const z = (Math.random() - 0.5) * 0.6;
    targetPositions[i].set(x, y, z);
    swordDirections[i].set(0, 1, 0); // 剑尖朝上
  }
}

function initRainPositions() {
  const spreadXZ = 5;
  const topY = 7;
  for (let i = 0; i < SWORD_COUNT; i++) {
    const x = (Math.random() - 0.5) * spreadXZ;
    const z = (Math.random() - 0.5) * spreadXZ;
    const y = topY + Math.random() * 4; // 分散在 7~11 高空
    targetPositions[i].set(x, y, z);
    currentPositions[i].set(x, y, z);
  }
}

// ========== MediaPipe 回调 ==========
function onHandResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const rawLM = results.multiHandLandmarks[0];
    const lm = smoothLandmarks(rawLM);
    lastHandData = lm;

    const rawGesture = recognizeGesture(lm);
    const newGesture = stabilizeGesture(rawGesture);

    if (newGesture !== currentGesture) {
      currentGesture = newGesture;
      // 状态切换时重新计算目标
      switch (currentGesture) {
        case 'explode': computeExplodeTargets(); break;
        case 'converge': computeConvergeTargets(); break;
        case 'spread': computeSpreadTargets(); break;
        case 'rain': initRainPositions(); break;

        case 'follow':
          // 进入跟随模式：预填路径历史，避免从原点跳变
          for (let i = 0; i < PATH_HISTORY_LENGTH; i++) {
            pathHistory[i].copy(followAccum);
          }
          pathWriteHead = 0;
          break;
      }
    }

    // 手掌重心 → 集群基础位置（跟随模式下由独立逻辑控制）
    if (currentGesture === 'follow') {
      clusterTargetBase.set(0, 0, 0);
    } else {
      const wrist = lm[0];
      clusterTargetBase.set(
        (wrist.x - 0.5) * 7,
        (0.5 - wrist.y) * 5,
        0
      );
    }

    // 跟随模式：将食指指尖屏幕坐标转换为世界坐标
    if (currentGesture === 'follow') {
      const idxTip = lm[8];
      const wrist = lm[0];

      // 手指指向方向（屏幕空间 → 世界空间近似）
      const screenDX = idxTip.x - wrist.x;
      const screenDY = idxTip.y - wrist.y;
      const dirLen = Math.sqrt(screenDX * screenDX + screenDY * screenDY);
      if (dirLen > 0.02) {
        followPointDir.set(screenDX / dirLen, -screenDY / dirLen, 0);
      }

      // 指尖世界坐标
      const ndcX = (1 - idxTip.x) * 2 - 1;
      const ndcY = -(idxTip.y * 2 - 1);
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const dist = -camera.position.z / dir.z;
      const worldPos = camera.position.clone().add(dir.multiplyScalar(dist));
      followTarget.set(worldPos.x, worldPos.y, 0);
    }

    // 持续更新非跟随模式下的目标位置（允许动态调整）
    if (currentGesture === 'explode') computeExplodeTargets();
    else if (currentGesture === 'converge') computeConvergeTargets();
    else if (currentGesture === 'spread') computeSpreadTargets();

    hintEl.style.opacity = '0';
  } else {
    // 无手部检测
    hintEl.style.opacity = '1';
  }
}

// ========== MediaPipe 初始化 ==========
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.75,
  minTrackingConfidence: 0.6,
});

hands.onResults(onHandResults);

const cameraUtils = new Camera(video, {
  onFrame: async () => { await hands.send({ image: video }); },
  width: 640,
  height: 480,
});

// ========== 动画循环 ==========
const clock = new THREE.Clock();
let sphereAngle = 0;


function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  const time = performance.now() * 0.001;

  // 平滑移动集群基础位置
  clusterBase.lerp(clusterTargetBase, LERP_SPEED * dt);

  // 状态更新
  switch (currentGesture) {
    case 'rain':
      // 落剑：每把剑独立速度 + 水平飘摆 + 剑身旋转
      for (let i = 0; i < SWORD_COUNT; i++) {
        const spd = rainSpeeds[i];
        // 匀速下落
        currentPositions[i].y -= spd * dt;
        // 水平飘摆：以初始XZ为原点做正弦波动
        const homeX = targetPositions[i].x;
        const homeZ = targetPositions[i].z;
        currentPositions[i].x = homeX + Math.sin(time * 3.3 + rainPhases[i]) * rainWobbleAmp[i];
        currentPositions[i].z = homeZ + Math.cos(time * 2.5 + rainPhases[i] + 1.3) * rainWobbleAmp[i] * 0.7;
        // 剑尖方向：略带翻滚
        const tumble = time * spd * 0.6 + rainPhases[i];
        swordDirections[i].set(Math.sin(tumble) * 0.3, -1, Math.cos(tumble) * 0.3).normalize();
        // 落到屏幕下方后回到高空
        if (currentPositions[i].y < -5.5) {
          currentPositions[i].y = 7 + Math.random() * 4;
          targetPositions[i].x = (Math.random() - 0.5) * 5;
          targetPositions[i].z = (Math.random() - 0.5) * 4;
        }
      }
      break;

    case 'converge':
      // 球体自转
      sphereAngle += dt * 1.2;
      computeConvergeTargets();
      for (let i = 0; i < SWORD_COUNT; i++) {
        const tp = targetPositions[i];
        const rx = tp.x * Math.cos(sphereAngle) - tp.z * Math.sin(sphereAngle);
        const rz = tp.x * Math.sin(sphereAngle) + tp.z * Math.cos(sphereAngle);
        const rotTarget = new THREE.Vector3(rx, tp.y, rz);
        currentPositions[i].lerp(rotTarget, LERP_SPEED * dt);
        swordDirections[i].copy(rotTarget).normalize();
      }
      break;

    case 'follow':
      // ============ 分段飘带跟随 ============
      // 手指静止时：持续朝指向方向延伸，避免剑阵僵在原地
      const distToFinger = followAccum.distanceTo(followTarget);
      if (distToFinger < 0.25 && followPointDir.length() > 0.3) {
        followTarget.x += followPointDir.x * dt * 3.5;
        followTarget.y += followPointDir.y * dt * 3.5;
      }

      // 每帧将当前平滑位置写入路径历史
      pathHistory[pathWriteHead].copy(followAccum);
      pathWriteHead = (pathWriteHead + 1) % PATH_HISTORY_LENGTH;

      for (let seg = 0; seg < SEGMENT_COUNT; seg++) {
        // 每段从路径历史中采样不同位置，越靠后延迟越大
        const trailDist = 1 + seg * SEGMENT_FRAME_SPACING;
        const histIdx = (pathWriteHead - trailDist + PATH_HISTORY_LENGTH) % PATH_HISTORY_LENGTH;
        const segPos = pathHistory[histIdx].clone();

        // 段的方向：沿路径切线
        const nextIdx = (histIdx + 3) % PATH_HISTORY_LENGTH;
        const prevIdx = (histIdx - 3 + PATH_HISTORY_LENGTH) % PATH_HISTORY_LENGTH;
        const segDir = pathHistory[nextIdx].clone().sub(pathHistory[prevIdx]);
        const segDirNorm = segDir.length() > 0.01 ? segDir.normalize() : new THREE.Vector3(0, 1, 0);

        // 垂直方向（用于飘带宽度）
        const perpX = -segDirNorm.y;
        const perpY = segDirNorm.x;

        for (let s = 0; s < SWORDS_PER_SEGMENT; s++) {
          const swordIdx = seg * SWORDS_PER_SEGMENT + s;
          if (swordIdx >= SWORD_COUNT) break;

          // 段内飞剑沿垂直方向展开，形成飘带宽度
          const perpSpread = (s / (SWORDS_PER_SEGMENT - 1 || 1) - 0.5) * 1.4;
          const target = segPos.clone();
          target.x += perpX * perpSpread;
          target.y += perpY * perpSpread;

          // 微小随机偏移，避免僵硬排列
          target.x += Math.sin(swordIdx * 4.1 + seg * 1.7) * 0.06;
          target.y += Math.cos(swordIdx * 5.7 + seg * 2.3) * 0.06;

          currentPositions[swordIdx].lerp(target, LERP_SPEED * dt);
          swordDirections[swordIdx].copy(segDirNorm);
        }
      }
      break;

    default:
      // 插值到目标位置
      for (let i = 0; i < SWORD_COUNT; i++) {
        currentPositions[i].lerp(targetPositions[i], LERP_SPEED * dt);
      }
      break;
  }

  // 跟随模式：followTarget 由 onHandResults 直接设为指尖世界坐标，此处无需累积
  // 非跟随模式：followTarget 逐渐归零
  if (currentGesture !== 'follow') {
    followTarget.lerp(new THREE.Vector3(0, 0, 0), 3 * dt);
  }
  // 跟随模式用更快的插值，减少延迟感
  const followSpeed = currentGesture === 'follow' ? 4 : 5;
  followAccum.lerp(followTarget, followSpeed * dt);

  // 空闲/无手势时：默认松散集群
  if (currentGesture === 'idle') {
    for (let i = 0; i < SWORD_COUNT; i++) {
      const t = time + i * 0.3;
      targetPositions[i].set(
        Math.sin(t * 0.7) * 2 + Math.cos(i * 1.3) * 0.5,
        Math.cos(t * 0.6) * 1.5 + Math.sin(i * 0.9) * 0.5,
        Math.cos(t * 0.8 + i) * 2
      );
      swordDirections[i].set(0, 1, 0);
    }
  }

  // 更新所有实例矩阵
  for (let i = 0; i < SWORD_COUNT; i++) {
    // 跟随模式：currentPositions 已是绝对世界坐标，无需偏移
    // 其他模式：叠加 clusterBase + followAccum
    const useAbsolute = currentGesture === 'follow';
    const basePos = useAbsolute
      ? currentPositions[i].clone()
      : currentPositions[i].clone().add(clusterBase).add(followAccum);

    // 剑朝向
    const dir = swordDirections[i].clone().normalize();
    // 从默认向上(0,1,0)旋转到目标方向
    quat.setFromUnitVectors(upVec, dir);

    // 剑身缩放
    let swordScale = 1;
    scl.set(swordScale, swordScale, swordScale);
    matrix4.compose(basePos, quat, scl);
    swordMesh.setMatrixAt(i, matrix4);

    // 辉光矩阵（略大 + 随机微浮动）
    const glowBase = 1.5;
    const glowScale = glowBase + Math.sin(time * 5 + i) * 0.15;
    scl.set(glowScale, glowScale, glowScale);
    matrix4.compose(basePos, quat, scl);
    glowMesh.setMatrixAt(i, matrix4);
  }
  swordMesh.instanceMatrix.needsUpdate = true;
  glowMesh.instanceMatrix.needsUpdate = true;

  // 剑尖光源跟随集群
  if (currentGesture === 'follow') {
    const leadPos = currentPositions[0].clone();
    pointLight.position.lerp(leadPos, 3 * dt);
  } else {
    const lightCenter = clusterBase.clone().add(followAccum);
    pointLight.position.lerp(lightCenter, 2 * dt);
  }

  // 更新拖尾粒子
  const trailPos = trailPoints.geometry.attributes.position.array;
  for (let i = 0; i < trailCount; i++) {
    const swordIdx = Math.floor(i / 3);
    const swordPos = (currentGesture === 'follow')
      ? currentPositions[swordIdx].clone()
      : currentPositions[swordIdx].clone().add(clusterBase).add(followAccum);
    trailPos[i * 3]     = swordPos.x + (Math.random() - 0.5) * 0.3;
    trailPos[i * 3 + 1] = swordPos.y + (Math.random() - 0.5) * 0.6 - 0.3;
    trailPos[i * 3 + 2] = swordPos.z + (Math.random() - 0.5) * 0.3;
  }
  trailPoints.geometry.attributes.position.needsUpdate = true;

  // 微移相机（让视角略微动态）
  if (currentGesture === 'follow') {
    // 跟随模式：相机追踪飞剑拖尾中心，打破 unproject 反馈循环
    let cx = 0, cy = 0;
    for (let i = 0; i < SWORD_COUNT; i++) {
      cx += currentPositions[i].x;
      cy += currentPositions[i].y;
    }
    cx /= SWORD_COUNT; cy /= SWORD_COUNT;
    camera.position.x += (cx * 0.15 - camera.position.x) * dt * 0.8;
    camera.position.y += (1.5 + cy * 0.1 - camera.position.y) * dt * 0.8;
    camera.lookAt(cx * 0.5, cy * 0.3, 0);
  } else {
    const camLookTargetX = clusterBase.x * 0.5 + followAccum.x;
    const camLookTargetY = clusterBase.y * 0.3 + followAccum.y;
    camera.position.x += (clusterBase.x * 0.15 - camera.position.x) * dt * 0.8;
    camera.position.y += (1.5 + clusterBase.y * 0.1 - camera.position.y) * dt * 0.8;
    camera.lookAt(camLookTargetX, camLookTargetY, 0);
  }

  // 状态提示
  const gestureNames = {
    explode: '💥 炸开·烟花剑阵',
    converge: '🔮 收拢·剑阵光球',
    spread: '📜 横铺·悬浮剑幕',
    rain: '🌧️ 落剑·倾泻',
    follow: '🐉 剑指·游龙飘带',

    idle: '⏳ 待命中…',
  };
  statusEl.textContent = gestureNames[currentGesture] || '';

  renderer.render(scene, camera);
}

// ========== 窗口适配 ==========
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ========== 启动 ==========
async function start() {
  try {
    await cameraUtils.start();
    hintEl.textContent = '手势就绪 ✨';
    setTimeout(() => { hintEl.style.opacity = '0'; }, 2000);
  } catch (e) {
    console.warn('摄像头启动失败，进入演示模式:', e.message);
    hintEl.textContent = '⚠️ 摄像头不可用 · 演示模式（无手势交互）';
    hintEl.style.opacity = '1';
    // 演示模式：在几个手势间自动切换
    const demos = ['explode', 'converge', 'spread', 'rain', 'converge', 'explode'];
    let demoIdx = 0;
    setInterval(() => {
      currentGesture = demos[demoIdx % demos.length];
      demoIdx++;
      switch (currentGesture) {
        case 'explode': computeExplodeTargets(); break;
        case 'converge': computeConvergeTargets(); break;
        case 'spread': computeSpreadTargets(); break;
        case 'rain': initRainPositions(); break;
      }
    }, 5000);
    // 初始化第一个状态
    currentGesture = 'explode';
    computeExplodeTargets();
  }
}

// 初始化默认目标位置
computeConvergeTargets();
currentGesture = 'idle';

animate();
start();
</script>
</body>
</html>
